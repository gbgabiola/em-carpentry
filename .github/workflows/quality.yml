name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build and tests
    # Standard public-repository runners are free. Reassess billing if made private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SITE_INDEXING_ENABLED: "false"
      SITE_URL: ""
      INTAKE_ENABLED: "false"
      SUPABASE_URL: ""
      SUPABASE_PUBLISHABLE_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck and production build
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Install Chromium, Firefox and WebKit for isolated browser tests
        run: npm run browser:install -- --with-deps
      - name: Run cross-browser desktop, phone and accessibility checks
        run: npm run test:browser
